<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Detalhes do Jogo - ' + ${game.name}">Detalhes do Jogo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ECF0F1; /* cinza-claro */
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        header {
            background: #2C3E50; /* azul-profundo */
            color: #ECF0F1; /* cinza-claro */
            padding: 10px 0;
            border-bottom: #1ABC9C 3px solid; /* verde-esmeralda */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 20px;
            padding-right: 20px;
        }
        header a {
            color: #ECF0F1; /* cinza-claro */
            text-decoration: none;
            text-transform: uppercase;
            font-size: 14px;
        }
        header ul {
            padding: 0;
            list-style: none;
            display: flex;
        }
        header li {
            display: inline;
            padding: 0 15px;
        }
        header #branding h1 {
            margin: 0;
        }
        #main {
            padding: 20px;
            background: #FFFFFF; /* branco */
            margin-top: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .game-row {
            display: flex; /* Define a div como um contêiner flexível */
            flex-direction: row; /* Organiza os itens em uma linha horizontal */
            justify-content: space-between; /* Espaça os itens igualmente */
            align-items: center; /* Alinha os itens ao topo */
            gap: 20px; /* Espaço entre os itens */
            width: 100%; /* Garante que ocupe toda a largura disponível */
            margin-bottom: 20px;
        }
        .game-details {
            flex: 1; /* Ocupa 1 parte do espaço disponível */
            max-width: 40%;
            align-items: left;
        }
        .game-title {
            text-align: center;
        }
        .game-title h1 {
            font-size: 36px;
            color: #2C3E50; /* azul-profundo */
            margin-bottom: 10px;
        }
        .game-title img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
        }
        .game-info {
            margin-top: 20px;
            text-align: left;
        }
        .game-info .details {
            margin-bottom: 15px;
            text-align: left;
        }
        .game-info .details span {
            display: block;
            font-weight: bold;
            color: #2C3E50;
            margin-bottom: 5px;
        }
        .review-section {
            flex: 2; /* Ocupa 2 partes do espaço disponível */
            max-width: 60%; /* Limita a largura máxima a 60% */
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .review-section h2 {
            color: #2C3E50;
            margin-bottom: 10px;
        }
        .review-section p {
            white-space: pre-wrap; /* Preserva quebras de linha */
            word-wrap: break-word;
            overflow-wrap: break-word;
            color: #555;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn {
            display: inline-block;
            color: #ECF0F1;
            background: #2C3E50;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background: #1ABC9C;
        }
        .details {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .details span:first-child {
            font-weight: bold;
            color: #2C3E50; /* Azul-profundo */
            margin-right: 5px;
        }
        .details .value {
            color: #555; /* Cinza-escuro */
        }
    </style>
</head>
<body>
    <header>
        <div id="branding">
            <h1>MyMultimediaNexus</h1>
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/game-list.html">Games</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <section id="main">
            <!-- Detalhes do jogo -->
            <div class="game-row">
                <div class="game-details">
                    <div class="game-title">
                        <h1 th:text="${game.name}">Nome do Jogo</h1>
                        <img th:src="'/images/game-cover.png'" alt="Imagem do Jogo">
                        <!-- Campos exibidos embaixo da imagem -->
                        <div class="game-info">
                            <div class="details">
                                <span>Gênero:</span>
                                <span th:text="${game.genre}" class="value"></span>
                            </div>
                            <div class="details">
                                <span>Ano de Lançamento:</span>
                                <span th:text="${game.releaseYear}" class="value"></span>
                            </div>
                            <div class="details">
                                <span>Desenvolvedor:</span>
                                <span th:text="${game.developer}" class="value"></span>
                            </div>
                        </div>
                    </div>
                </div>
    
                <!-- Seção de review -->
                <div class="review-section">
                    <h2>Review</h2>
                    <p th:text="${game.review}">Nenhuma review disponível.</p>
                </div>
            </div>

            <!-- Botões de ação -->
            <div class="actions">
                <a href="/game-list.html" class="btn">Voltar</a>
                <a th:href="@{/games/edit/{id}(id=${game.id})}" class="btn">Editar</a>
            </div>
        </section>
    </div>
</body>
</html>
