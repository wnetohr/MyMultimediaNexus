<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Jogos - MyMultimediaNexus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ECF0F1; /* cinza-claro */
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        header {
            background: #2C3E50; /* azul-profundo */
            color: #ECF0F1; /* cinza-claro */
            padding: 10px 0; /* Reduzir a altura do header */
            border-bottom: #1ABC9C 3px solid; /* verde-esmeralda */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 20px; /* Adicionar espaçamento à esquerda */
            padding-right: 20px; /* Adicionar espaçamento à direita */
        }
        header a {
            color: #ECF0F1; /* cinza-claro */
            text-decoration: none;
            text-transform: uppercase;
            font-size: 14px; /* Diminuir levemente o tamanho das páginas de navegação */
        }
        header ul {
            padding: 0;
            list-style: none;
            display: flex;
        }
        header li {
            display: inline;
            padding: 0 15px; /* Ajustar o espaçamento */
        }
        header #branding h1 {
            margin: 0;
        }
        #main {
            padding: 20px;
            background: #FFFFFF; /* branco */
            margin-top: 20px;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
        }
        table, th, td {
            border: none; /* Remover bordas */
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #2C3E50; /* azul-profundo */
            color: #ECF0F1; /* cinza-claro */
        }
        .btn {
            display: inline-block;
            color: #ECF0F1; /* cinza-claro */
            background: #2C3E50; /* azul-profundo */
            padding: 7px 20px;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background: #1ABC9C; /* verde-esmeralda */
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #2C3E50; /* azul-profundo */
            font-size: 18px;
            margin: 0 5px;
        }
        .icon-btn:hover {
            color: #1ABC9C; /* verde-esmeralda */
        }
        .actions {
            display: flex;
            justify-content: flex-end;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <header>
        <div id="branding">
            <h1>MyMultimediaNexus</h1>
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/game-list.html">Games</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <section id="main">
            <div class="header-content">
                <h1>Minha lista de jogos</h1>
                <a href="/games/new" class="btn">Adicionar Jogo</a>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Gênero</th>
                        <th>Ano de Lançamento</th>
                        <th>Desenvolvedor</th>
                        <th></th> <!-- Coluna para os ícones de ações -->
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="game : ${games}">
                        <td th:text="${game.name}"></td>
                        <td th:text="${game.genre}"></td>
                        <td th:text="${game.releaseYear}"></td>
                        <td th:text="${game.developer}"></td>
                        <td class="actions">
                            <a th:href="@{/games/edit/{id}(id=${game.id})}" class="icon-btn">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/games/delete/{id}(id=${game.id})}" class="icon-btn">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
